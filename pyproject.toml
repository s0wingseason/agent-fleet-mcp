[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-fleet-mcp"
version = "0.1.0b1"
description = "MCP server that lets a lead agent run manager and child agents across ChatGPT/Codex, Google Antigravity, Claude Code and local models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "s0wingseason" }]
keywords = ["mcp", "model-context-protocol", "agents", "multi-agent", "codex", "antigravity", "claude"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "mcp>=1.12,<2",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "starlette>=0.40",
  "tomlkit>=0.13",
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
desktop = [
  "pywinauto>=0.6.9; sys_platform == 'win32'",
  "Pillow>=10",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pyinstaller>=6.10",
]

[project.scripts]
agent-fleet = "agent_fleet.cli:main"

[project.urls]
Homepage = "https://github.com/s0wingseason/agent-fleet-mcp"
Issues = "https://github.com/s0wingseason/agent-fleet-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_fleet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: talks to real local backends (skipped unless AGENT_FLEET_LIVE=1)"]
